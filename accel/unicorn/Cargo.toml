[package]
name = "mosaic-accel-unicorn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.layer]
domain = "accel"
kind = "accel"
level = 3

# One reviewed unsafe Send implementation; everything else denies unsafe.
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"

[dependencies]
mosaic-exec = { path = "../../exec" }
mosaic-contract = { path = "../../contract" }
unicorn-engine = { version = "=2.1.5", default-features = false, features = ["arch_arm", "arch_aarch64", "arch_x86"] }

[dev-dependencies]
mosaic-isa-arm = { path = "../../isa/arm" }
mosaic-isa-aarch64 = { path = "../../isa/aarch64" }
mosaic-isa-x86 = { path = "../../isa/x86" }
mosaic-isa-riscv = { path = "../../isa/riscv" }

[features]
# Design §12.3 rule 6: `arch_*` narrows the ISA set built into the backend.
# The RV32I adapter and its tests join only when a composition opts in.
arch-riscv = ["unicorn-engine/arch_riscv"]

name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Architecture checks
        run: cargo xtask check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --locked --workspace --all-targets --all-features
      - name: Unit and integration tests
        run: cargo test --locked --workspace --all-features
      - name: Runtime trace and snapshot replay smoke test
        shell: bash
        run: |
          cargo run --locked --package mosaic-core-runtime --example events > "$RUNNER_TEMP/runtime-events.stdout"
          diff -u tests/runtime-events.stdout "$RUNNER_TEMP/runtime-events.stdout"
      - name: Workspace diagnostics
        run: cargo xtask doctor

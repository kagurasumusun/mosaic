name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (Node.js 24)
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: Native engine build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake pkg-config libclang-dev

      # 全チェックは if: always() で独立に実行し、結果を ci-reports/ に集約する。
      # Actions のログはホスト外から取得できないことがあるため、レポートは
      # ブランチへ commit/push して正本にする（GITHUB_TOKEN の push は再トリガーしない）。
      - name: Report header
        run: |
          mkdir -p ci-reports
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "commit: ${{ github.sha }}"
            echo "ref: ${{ github.ref }}"
            echo "started: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ci-reports/status.txt

      # rustfmt は適用のみ行い、差分をレポートに記録する（コミットはしない）。
      - name: Formatting
        if: always()
        run: |
          set +e
          cargo fmt --all > ci-reports/fmt.log 2>&1
          code=$?
          # ci-reports 自体は追跡済みなので差分の対象から除外する
          # （自己参照で常に fail になるのを防ぐ）。
          git diff -- . ':(exclude)ci-reports' > ci-reports/rustfmt.diff
          if [ $code -eq 0 ] && [ ! -s ci-reports/rustfmt.diff ]; then
            echo "formatting: ok" >> ci-reports/status.txt
          else
            echo "formatting: fail (code=$code, see rustfmt.diff)" >> ci-reports/status.txt
          fi
          exit 0

      - name: Architecture checks
        if: always()
        run: |
          set +e
          cargo xtask check > ci-reports/xtask.log 2>&1
          code=$?
          echo "xtask: $([ $code -eq 0 ] && echo ok || echo "fail (code=$code)")" >> ci-reports/status.txt
          exit 0

      - name: Clippy
        if: always()
        run: |
          set +e
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings > ci-reports/clippy.log 2>&1
          code=$?
          echo "clippy: $([ $code -eq 0 ] && echo ok || echo "fail (code=$code)")" >> ci-reports/status.txt
          exit 0

      - name: Build
        if: always()
        run: |
          set +e
          cargo build --locked --workspace --all-targets --all-features > ci-reports/build.log 2>&1
          code=$?
          echo "build: $([ $code -eq 0 ] && echo ok || echo "fail (code=$code)")" >> ci-reports/status.txt
          exit 0

      - name: Unit and integration tests
        if: always()
        env:
          RUST_BACKTRACE: 1
        run: |
          set +e
          # --no-fail-fast: 1 つのクレートの失敗で他クレートのテストが
          # 未実行のまま隠れるのを防ぐ（1 run で全体像を把握する）。
          cargo test --locked --workspace --all-features --no-fail-fast > ci-reports/test.log 2>&1
          code=$?
          echo "test: $([ $code -eq 0 ] && echo ok || echo "fail (code=$code)")" >> ci-reports/status.txt
          # 失敗したテスト名と panic メッセージを先頭に抜き出しておく。
          grep -n -E "^failures:$|panicked at|^test .* FAILED|test result: FAILED|^error(\[|:)" ci-reports/test.log \
            | head -120 > ci-reports/test-summary.txt || true
          exit 0

      - name: Runtime trace and snapshot replay smoke test
        if: always()
        run: |
          set +e
          cargo run --locked --package mosaic-core-runtime --example events > ci-reports/runtime-events.stdout 2> ci-reports/runtime-events.log
          code=$?
          diff -u tests/runtime-events.stdout ci-reports/runtime-events.stdout >> ci-reports/runtime-events.log 2>&1
          dcode=$?
          echo "smoke-events: $([ $code -eq 0 ] && [ $dcode -eq 0 ] && echo ok || echo "fail (run=$code diff=$dcode)")" >> ci-reports/status.txt
          exit 0

      - name: Machine MMIO dispatch smoke test
        if: always()
        run: |
          set +e
          cargo run --locked --package mosaic-core-runtime --example machine > ci-reports/machine-mmio.stdout 2> ci-reports/machine-mmio.log
          code=$?
          diff -u tests/machine-mmio.stdout ci-reports/machine-mmio.stdout >> ci-reports/machine-mmio.log 2>&1
          dcode=$?
          echo "smoke-machine: $([ $code -eq 0 ] && [ $dcode -eq 0 ] && echo ok || echo "fail (run=$code diff=$dcode)")" >> ci-reports/status.txt
          exit 0

      - name: Runtime machine snapshot and replay smoke test
        if: always()
        run: |
          set +e
          cargo run --locked --package mosaic-core-runtime --example snapshot > ci-reports/machine-snapshot.stdout 2> ci-reports/machine-snapshot.log
          code=$?
          diff -u tests/machine-snapshot.stdout ci-reports/machine-snapshot.stdout >> ci-reports/machine-snapshot.log 2>&1
          dcode=$?
          echo "smoke-snapshot: $([ $code -eq 0 ] && [ $dcode -eq 0 ] && echo ok || echo "fail (run=$code diff=$dcode)")" >> ci-reports/status.txt
          exit 0

      - name: Unicorn ARM execution smoke test
        if: always()
        run: |
          set +e
          cargo run --locked --package mosaic-apps-cli --features unicorn -- unicorn-smoke > ci-reports/unicorn-arm.stdout 2> ci-reports/unicorn-arm.log
          code=$?
          diff -u tests/unicorn-arm.stdout ci-reports/unicorn-arm.stdout >> ci-reports/unicorn-arm.log 2>&1
          dcode=$?
          echo "smoke-unicorn: $([ $code -eq 0 ] && [ $dcode -eq 0 ] && echo ok || echo "fail (run=$code diff=$dcode)")" >> ci-reports/status.txt
          exit 0

      - name: P1 bring-up golden test
        if: always()
        run: |
          set +e
          cargo run --locked --package mosaic-apps-bringup --features unicorn > ci-reports/bringup.log 2>&1
          code=$?
          echo "bringup: $([ $code -eq 0 ] && echo ok || echo "fail (code=$code)")" >> ci-reports/status.txt
          exit 0

      - name: P2 sensor-bus golden test
        if: always()
        run: |
          set +e
          cargo run --locked --package mosaic-apps-sensorbus --features unicorn > ci-reports/sensorbus.log 2>&1
          code=$?
          echo "sensorbus: $([ $code -eq 0 ] && echo ok || echo "fail (code=$code)")" >> ci-reports/status.txt
          exit 0

      - name: P3 multicore golden test
        if: always()
        run: |
          set +e
          cargo run --locked --package mosaic-apps-multicore --features riscv > ci-reports/multicore.log 2>&1
          code=$?
          echo "multicore: $([ $code -eq 0 ] && echo ok || echo "fail (code=$code)")" >> ci-reports/status.txt
          exit 0

      - name: Workspace diagnostics
        if: always()
        run: |
          set +e
          cargo xtask doctor > ci-reports/doctor.log 2>&1
          code=$?
          echo "doctor: $([ $code -eq 0 ] && echo ok || echo "fail (code=$code)")" >> ci-reports/status.txt
          exit 0

      - name: Publish report to the branch
        if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          branch="${GITHUB_REF#refs/heads/}"
          echo "finished: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> ci-reports/status.txt
          git config user.name "ci-report-bot"
          git config user.email "ci-report-bot@users.noreply.github.com"
          git add ci-reports
          if git diff --cached --quiet; then
            echo "report unchanged; nothing to push"
            exit 0
          fi
          git commit -m "CI report for ${GITHUB_SHA::7}"
          git fetch origin "$branch" || true
          git rebase FETCH_HEAD || git rebase --abort || true
          git push origin "HEAD:$branch" || echo "report push failed (branch moved?)"

      - name: Conclusion
        if: always()
        run: |
          cat ci-reports/status.txt
          if grep -q "fail" ci-reports/status.txt; then
            echo "one or more checks failed; see ci-reports/ on the branch"
            exit 1
          fi

[workspace]
resolver = "2"
members = [
    "util",
    "exec",
    "contract",
    "runtime",
    "isa/arm",
    "isa/aarch64",
    "isa/x86",
    "isa/riscv",
    "accel/unicorn",
    "accel/armv7m",
    "accel/conformance",
    "hw",
    "machine",
    "bus",
    "boot",
    "describe",
    "assemble",
    "mosaic",
    "tests",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
# License intentionally pending owner decision; all crates are non-publishable.

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

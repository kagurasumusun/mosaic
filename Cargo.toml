[workspace]
resolver = "2"
members = [
    "crates/util",
    "crates/exec",
    "crates/contract",
    "crates/runtime",
    "crates/isa/arm",
    "crates/isa/aarch64",
    "crates/isa/x86",
    "crates/isa/riscv",
    "crates/accel/unicorn",
    "crates/accel/armv7m",
    "crates/accel/conformance",
    "crates/hw",
    "crates/machine",
    "crates/bus",
    "crates/boot",
    "crates/describe",
    "crates/assemble",
    "crates/mosaic",
    "crates/tests",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
# License intentionally pending owner decision; all crates are non-publishable.

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

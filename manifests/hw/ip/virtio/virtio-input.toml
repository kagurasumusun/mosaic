[identity]
id = 'ip:virtio/virtio-input'
summary = 'VirtIO evdev input device on the MMIO transport'
spec = ['VirtIO Specification v1.1']
variants = []

[tags]
function = ['input']
fidelity = 'functional'
verified = 'spec-tested'

[ports]
mmio = { role = 'target', size = 0x200 }
irq = { role = 'source', pins = ['irq'] }

[params]
# Evdev device name.
name = { type = 'string', default = 'mosaic-input' }

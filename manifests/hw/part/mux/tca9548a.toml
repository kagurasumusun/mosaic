# TI TCA9548A I2C スイッチの記述。値は TI TCA9548A データシート (SCDS147)
# に基づく。xtask の lint-catalog が部品メタデータと参照を検証する。
[part]
id = 'part:ti/tca9548a'
origin = 'ti'
name = 'TCA9548A'
summary = '8-channel I2C bus switch with a single control register'
bindings = ['i2c']
provenance = { doc = 'TI TCA9548A datasheet', confidence = 'high' }

# 多面部品 (ADR 0032): 上流は 1 つの i2c ターゲット面、下流 8 チャネルは
# それぞれ独立した i2c イニシエータ面 (セグメントバス)。
[ports]
i2c = { contract = 'i2c/target', role = 'target' }
down = { contract = 'i2c/initiator', role = 'initiator', count = 8 }

# アドレスは A0-A2 ピンで 0x70..0x77。制御レジスタへの書き込み 1 バイトで
# チャネルを切り替える。電源投入時は全チャネル切断（制御レジスタ 0x00）。
[i2c]
addresses = [0x70, 0x71, 0x72, 0x73, 0x74, 0x75, 0x76, 0x77]
channels = 8

[[register]]
name = 'control'
offset = 0x00
access = 'rw'
reset = 0x00
note = 'bit n = チャネル n のイネーブル。唯一のレジスタ'

[package]
name = "mosaic-tests-boot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.layer]
domain = "tests"
kind = "tests"
level = 7

[lints]
workspace = true

[lib]
name = "mosaic_tests_boot"
path = "src/lib.rs"

[dependencies]
mosaic = { path = "../mosaic" }
mosaic-block = { path = "../block" }

[dependencies.toml]
version = "0.8"
default-features = false
features = ["parse", "display"]

[features]
default = []
unicorn = ["mosaic/unicorn"]

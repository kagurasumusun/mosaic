# Mosaic boot-test image catalog.
#
# One [[image]] block per real guest image. The harness (tests/src/lib.rs)
# boots each image on the named machine and asserts the `expect` patterns —
# the same generic loop for every OS, exactly like selecting a CD in a system
# emulator. No entry here is a synthetic image, and no test anywhere in this
# repository fabricates boot output.
#
# Provisioning kinds (`source`):
#   committed — the file lives in tests/assets/ inside the repository.
#   download  — `cargo xtask images fetch` downloads it (url) into
#               test-images/ and verifies sha256. Never committed. A download
#               entry without sha256 is a catalog error.
#   manual    — the operator supplies the file in test-images/ themselves
#               (redistribution-restricted media or local builds). sha256 is
#               optional: recorded once a specific build is known.
#
# Boot plans (`boot`):
#   cdrom          — boot the image as a CD-ROM (`-cdrom`).
#   floppy         — boot the image as a floppy (`-fda`, boot order `a`).
#   harddisk       — boot the image as a hard disk (`-hda`, boot order `c`).
#   kernel-from-iso — extract kernel/initrd from the entry's own ISO and
#                    boot directly (`-kernel`/`-initrd`/`-append`).
#   kernel-files   — the entry's `file` IS the kernel (bzImage); an optional
#                    `initrd-file` (+`initrd-url`/`initrd-sha256` for
#                    fetching) rides along.
#   deferred       — no boot plan expressible against the machines that
#                    exist today; the entry is a ledger row until it is.
#
# Status (`status`):
#   asserted        — the expectation patterns are a complete contract.
#   bring-up        — real image, real boot; the patterns are the milestone
#                     this machine has already reached on it. Move the
#                     milestone forward as the machine grows; never delete
#                     the entry.
#   machine-pending — the machine or boot plan this image needs is not
#                     implemented yet; the harness skips with the reason.
#
# `budget` is the instruction budget; `expect` patterns are searched in the
# joined screen + serial output the guest actually produced.

# ---------------------------------------------------------------------------
# Linux — the owner's list, one entry per real image, per architecture.
# ---------------------------------------------------------------------------

[[image]]
id = "linux/tinycore-16-core"
os = "linux"
distro = "Tiny Core Linux 16 Core (i386)"
machine = "pc"
arch = "x86"
source = "committed"
file = "tinycore-16-core.iso"
sha256 = "e2d98595cf62133df71516602c12aa685c6b4da19db3068d150e4946415d0d86"
boot = "cdrom"
budget = 20_000_000
expect = ["ISOLINUX"]
status = "bring-up"
note = "ISOLINUX banner and CD reads; the kernel hand-off is the next milestone"

[[image]]
id = "linux/tinycore-16-kernel"
os = "linux"
distro = "Tiny Core Linux 16 kernel + initramfs (i386 bzImage)"
machine = "pc"
arch = "x86"
source = "committed"
file = "tinycore-16-core.iso"
sha256 = "e2d98595cf62133df71516602c12aa685c6b4da19db3068d150e4946415d0d86"
boot = "kernel-from-iso"
kernel = "boot/vmlinuz"
initrd = "boot/core.gz"
append = "console=ttyS0,115200 console=tty0"
budget = 400_000_000
expect = [
    "Linux version",
    "honours the WP bit even in supervisor mode...Ok.",
    "Memory: ",
    "clocksource: Switched to clocksource pit",
    "BogoMIPS",
]
status = "bring-up"
note = "kernel decompresses, runs its early init, calibrates against the machine's PIT-driven IRQ 0 (BogoMIPS, clocksource pit) and drives its initcall sequence; the next milestone is initramfs unpack, which only needs a longer budget"


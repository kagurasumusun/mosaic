# Versatile/PB 由来 IP を使う P1/P2 の統合テスト用合成 SoC。
# これは実機 Versatile/PB の忠実なメモリマップではない。P2 の検証用 DW-APB-I2C は
# 実機で SIC に使われるアドレス領域に意図的に配置しているため、実機互換 board として
# 扱ってはならない。実機忠実構成は別 ID / manifest で定義する。
# xtask の lint-catalog が型付きスキーマとして検証し、MachineGraph に正規化する。
[soc]
id = 'soc:arm/versatile/arm926ej-s'
summary = 'Synthetic P1/P2 test topology using Versatile/PB-derived IP; not a faithful physical board memory map'

[[cpu]]
name = 'core0'
use = 'cpu:arm/arm926ej-s'
view = 'sysbus'

# 合成構成では PL190 VIC を 0x10140000 に配置し、周辺 IRQ を入力へ集約する。
[[block]]
name = 'vic0'
use = 'ip:arm/pl190'
at = { space = 'sysbus', base = 0x10140000 }
irq = [
  { pin = 'irq', to = ['core0.irq:irq'] },
  { pin = 'fiq', to = ['core0.irq:fiq'] },
]

# PL011 UART0: Versatile/PB 由来のアドレス 0x101F1000、VIC input 12.
[[block]]
name = 'uart0'
use = 'ip:arm/pl011'
at = { space = 'sysbus', base = 0x101f1000 }
irq = { pin = 'combined', to = ['vic0.inputs:12'] }
clk = { uartclk = 'clk_uart', pclk = 'clk_pclk' }

# SP804 dual timer: timer1/2 は個別ルートとして VIC input 4/5 へ接続。
[[block]]
name = 'timer0'
use = 'ip:arm/sp804'
at = { space = 'sysbus', base = 0x101e2000 }
irq = [
  { pin = 'timer1', to = ['vic0.inputs:4'] },
  { pin = 'timer2', to = ['vic0.inputs:5'] },
]

# --- P2 スライス追加（構成設計書 §13 P2 / apps/sensorbus と同じ機械地図） ---

# DW-APB-I2C マスタ。この合成スライスでは 0x10002000 に置く（実 Versatile TRM
# では同領域は SIC）。スライスの宣言は apps/sensorbus の構成と一致させる。
# セグメントは PL061 のビットバング線（gpio0 pin0/pin1）と同一バスを共有し、
# 同じ部品に控制器経路とピン経路の両方から到達できる（P2 完了条件）。
[[block]]
name = 'i2c0'
use = 'ip:synopsys/dw-apb-i2c'
at = { space = 'sysbus', base = 0x10002000 }
irq = { pin = 'combined', to = ['vic0.inputs:13'] }

# PL022 SSP: Versatile/PB では 0x1000D000、VIC 割り込み 11。
[[block]]
name = 'ssp0'
use = 'ip:arm/pl022'
at = { space = 'sysbus', base = 0x1000d000 }
irq = { pin = 'combined', to = ['vic0.inputs:11'] }

# PL061 GPIO0: Versatile/PB では 0x101E4000、VIC 割り込み 6。
# pin0 = SDA、pin1 = SCL のビットバング線（プルアップネット経由で
# i2c0 セグメントと同じバス実体に接続する）。
[[block]]
name = 'gpio0'
use = 'ip:arm/pl061'
at = { space = 'sysbus', base = 0x101e4000 }
irq = { pin = 'combined', to = ['vic0.inputs:6'] }

[[view]]
name = 'sysbus'

[[view.region]]
name = 'vic0-mmio'
target = 'vic0'
base = 0x10140000
size = 0x00001000
kind = 'mmio'

[[view.region]]
name = 'gpio0-mmio'
target = 'gpio0'
base = 0x101e4000
size = 0x00001000
kind = 'mmio'

[[view.region]]
name = 'i2c0-mmio'
target = 'i2c0'
base = 0x10002000
size = 0x00001000
kind = 'mmio'

[[view.region]]
name = 'ram'
target = 'ram'
base = 0x00000000
size = 0x00100000
kind = 'ram'

[[view.region]]
name = 'ssp0-mmio'
target = 'ssp0'
base = 0x1000d000
size = 0x00001000
kind = 'mmio'

[[view.region]]
name = 'timer0-mmio'
target = 'timer0'
base = 0x101e2000
size = 0x00001000
kind = 'mmio'

[[view.region]]
name = 'uart0-mmio'
target = 'uart0'
base = 0x101f1000
size = 0x00001000
kind = 'mmio'

[package]
name = "mosaic-board-ibm-pc-glue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.layer]
domain = "catalog"
kind = "board"
level = 3

[lints]
workspace = true

[dependencies]
mosaic-core-types = { path = "../../../../../framework/core/types" }
mosaic-contract-cpu-engine = { path = "../../../../../framework/contract/cpu-engine" }
mosaic-contract-mmio = { path = "../../../../../framework/contract/mmio" }
mosaic-contract-model = { path = "../../../../../framework/contract/model" }
mosaic-modelkit-iso9660 = { path = "../../../../../framework/modelkit/iso9660" }
mosaic-isa-x86 = { path = "../../../../../framework/isa/x86" }

# Board wiring reaches the chips it mounts (design §8: catalog leaves) and
# the engine adapters its boot loop drives (R5 as amended by ADR 0023 —
# QEMU's hw/<arch> machines equally use the cpu core directly).
mosaic-ip-x86-pic-8259 = { path = "../../../../ip/x86/pic-8259" }
mosaic-ip-x86-pit-8254 = { path = "../../../../ip/x86/pit-8254" }
mosaic-ip-x86-rtc-mc146818 = { path = "../../../../ip/x86/rtc-mc146818" }

mosaic-engine-unicorn = { path = "../../../../../framework/engine/unicorn", optional = true }

[features]
default = []
unicorn = ["dep:mosaic-engine-unicorn"]

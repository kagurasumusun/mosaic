[package]
name = "mosaic-part-bosch-bme280"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.layer]
domain = "catalog"
kind = "part"
level = 3

[lints]
workspace = true

[features]
default = ["bind-i2c", "bind-spi"]
bind-i2c = ["dep:mosaic-contract-i2c", "dep:mosaic-contract-model"]
bind-spi = ["dep:mosaic-contract-spi", "dep:mosaic-contract-model"]

[dependencies]
mosaic-prim-bits = { path = "../../../../framework/prim/bits" }
mosaic-contract-i2c = { path = "../../../../framework/contract/i2c", optional = true }
mosaic-contract-spi = { path = "../../../../framework/contract/spi", optional = true }
mosaic-contract-model = { path = "../../../../framework/contract/model", optional = true }

[dev-dependencies]
mosaic-core-types = { path = "../../../../framework/core/types" }

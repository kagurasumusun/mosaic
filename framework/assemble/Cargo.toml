[package]
name = "mosaic-assemble"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.layer]
domain = "framework"
kind = "assemble"
level = 5

[lints]
workspace = true

[features]
# The native CPU backend stays opt-in, matching the CLI and ADR 0007.
unicorn = ["dep:mosaic-engine-unicorn"]

[dependencies]
mosaic-contract-cpu-engine = { path = "../contract/cpu-engine" }
mosaic-core-runtime = { path = "../core/runtime" }
mosaic-core-types = { path = "../core/types" }
mosaic-describe = { path = "../describe" }
mosaic-engine-unicorn = { path = "../engine/unicorn", optional = true }

[dev-dependencies]
mosaic-contract-mmio = { path = "../contract/mmio" }
mosaic-contract-model = { path = "../contract/model" }
mosaic-contract-signal = { path = "../contract/signal" }
mosaic-isa-arm = { path = "../isa/arm" }

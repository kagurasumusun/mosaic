[package]
name = "mosaic-engine-unicorn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.layer]
domain = "framework"
kind = "engine"
level = 3

# One reviewed unsafe Send implementation; everything else denies unsafe.
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"

[dependencies]
mosaic-core-types = { path = "../../core/types" }
mosaic-contract-cpu-engine = { path = "../../contract/cpu-engine" }
unicorn-engine = { version = "=2.1.5", default-features = false, features = ["arch_arm"] }

[dev-dependencies]
mosaic-isa-arm = { path = "../../isa/arm" }
mosaic-isa-riscv = { path = "../../isa/riscv" }

[features]
# Design §12.3 rule 6: `arch_*` narrows the ISA set built into the backend.
# The RV32I adapter and its tests join only when a composition opts in.
arch-riscv = ["unicorn-engine/arch_riscv"]

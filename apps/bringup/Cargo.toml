[package]
name = "mosaic-apps-bringup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.layer]
domain = "apps"
kind = "app"
level = 6

[lints]
workspace = true

[features]
default = []
# The CPU backend stays opt-in, matching the CLI and ADR 0007.
unicorn = [
    "dep:mosaic-engine-unicorn",
    "mosaic-assemble/unicorn",
]

[dependencies]
mosaic-assemble = { path = "../../framework/assemble" }
mosaic-contract-model = { path = "../../framework/contract/model" }
mosaic-contract-stream = { path = "../../framework/contract/stream" }
mosaic-core-runtime = { path = "../../framework/core/runtime" }
mosaic-core-types = { path = "../../framework/core/types" }
mosaic-engine-unicorn = { path = "../../framework/engine/unicorn", optional = true }
mosaic-interconnect-uart-pair = { path = "../../framework/interconnect/uart-pair" }
mosaic-ip-arm-pl011 = { path = "../../catalog/ip/arm/pl011" }
mosaic-ip-arm-sp804 = { path = "../../catalog/ip/arm/sp804" }
mosaic-isa-arm = { path = "../../framework/isa/arm" }

[package]
name = "mosaic-apps-system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "mosaic-system"
path = "src/main.rs"

[package.metadata.layer]
domain = "apps"
kind = "app"
level = 6

[lints]
workspace = true

[dependencies]
# The machine this front-end dispatches to (ADR 0023): models live in the
# catalog, not in this crate. `-cpu` still maps to the pc's engine vocabulary
# here because option parsing is a front-end job (apps → engine/* is legal).
mosaic-board-ibm-pc-glue = { path = "../../catalog/board/ibm/pc/glue" }
mosaic-modelkit-iso9660 = { path = "../../framework/modelkit/iso9660" }
mosaic-engine-unicorn = { path = "../../framework/engine/unicorn", optional = true }

[features]
default = []
unicorn = ["dep:mosaic-engine-unicorn", "mosaic-board-ibm-pc-glue/unicorn"]

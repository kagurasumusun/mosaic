[package]
name = "mosaic-apps-multicore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.layer]
domain = "apps"
kind = "app"
level = 6

[lints]
workspace = true

[features]
default = []
# The CPU backend stays opt-in, matching the CLI and ADR 0007.
unicorn = [
    "dep:mosaic-engine-unicorn",
    "mosaic-assemble/unicorn",
]
# The P3 scenario is heterogeneous by definition: it needs the RV32I core.
riscv = [
    "unicorn",
    "mosaic-assemble/unicorn-riscv",
    "dep:mosaic-cpu-sifive-e31",
]

[dependencies]
mosaic-assemble = { path = "../../framework/assemble" }
mosaic-contract-cpu-engine = { path = "../../framework/contract/cpu-engine" }
mosaic-contract-model = { path = "../../framework/contract/model" }
mosaic-contract-stream = { path = "../../framework/contract/stream" }
mosaic-core-runtime = { path = "../../framework/core/runtime" }
mosaic-core-types = { path = "../../framework/core/types" }
mosaic-cpu-arm-arm926ej-s = { path = "../../catalog/cpu/arm/arm926ej-s" }
mosaic-cpu-sifive-e31 = { path = "../../catalog/cpu/sifive/e31", optional = true }
mosaic-engine-unicorn = { path = "../../framework/engine/unicorn", optional = true }
mosaic-interconnect-uart-pair = { path = "../../framework/interconnect/uart-pair" }
mosaic-ip-arm-mhu = { path = "../../catalog/ip/arm/mhu" }
mosaic-ip-arm-pl011 = { path = "../../catalog/ip/arm/pl011" }
